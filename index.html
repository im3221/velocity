<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업용 Gemini AI 웹앱 🤖</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f5f7fa; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 15px; }
        input, textarea, button { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; }
        button { background-color: #1a73e8; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        #output { background: #f8f9fa; padding: 15px; border-left: 5px solid #1a73e8; white-space: pre-wrap; margin-top: 20px; border-radius: 4px; min-height: 50px; }
        .api-box { background: #e8f0fe; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🤖 수업용 Gemini AI 웹앱</h2>
        <p style="margin: 0; color: #666; font-size: 14px;">선생님이 만든 깃허브 웹페이지에 연결되었습니다!</p>
        <hr style="border: 0; height: 1px; background: #eee;">
        
        <!-- API 키 입력 박스 -->
        <div class="api-box">
            <label for="apiKey" style="font-weight: bold; color: #1a73e8;">🔑 구글 AI 스튜디오 API 키 입력:</label><br>
            <input type="password" id="apiKey" placeholder="AIzaSy...로 시작하는 키를 입력하세요" style="width: 95%; margin-top: 8px;">
            <p style="font-size: 12px; color: #666; margin: 5px 0 0 0;">※ 입력한 키는 브라우저에만 임시 유지되며 안전합니다.</p>
        </div>

        <label for="prompt" style="font-weight: bold;">💡 AI에게 질문하기:</label>
        <textarea id="prompt" rows="4" placeholder="AI에게 물어보고 싶은 내용을 적어보세요!"></textarea>
        
        <button onclick="askGemini()">AI에게 답변 듣기 🚀</button>

        <h3>✨ 답변 결과</h3>
        <div id="output">질문을 입력하고 버튼을 누르면 여기에 답변이 나타납니다...</div>
    </div>

    <!-- 구글 Gemini API 공식 라이브러리 로드 -->
    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        async function askGemini() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const promptText = document.getElementById('prompt').value.trim();
            const outputDiv = document.getElementById('output');

            if (!apiKey) { alert('API 키를 입력해주세요!'); return; }
            if (!promptText) { alert('질문을 입력해주세요!'); return; }

            outputDiv.innerText = "AI가 생각하는 중입니다... 잠시만 기다려주세요 ⏳";

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: promptText,
                });
                outputDiv.innerText = response.text;
            } catch (error) {
                console.error(error);
                outputDiv.innerText = "오류가 발생했습니다: " + error.message;
            }
        }
        window.askGemini = askGemini;
    </script>
</body>
</html>
